<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alessandro Falanque – Carreira em Cloud, Data & AI</title>

  <!-- hreflang para o Google indexar as duas versões -->
  <link rel="alternate" hreflang="pt-br" href="https://alessandrofalanque.com/br/" />
  <link rel="alternate" hreflang="en-au" href="https://alessandrofalanque.com/au/" />
  <link rel="alternate" hreflang="x-default" href="https://alessandrofalanque.com/" />

  <!-- Detecta o idioma do navegador e redireciona (roda antes de renderizar) -->
  <script>
    (function () {
      try {
        var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
        // Português (Brasil/PT) -> /br ; qualquer outro -> /au (inglês)
        var target = lang.indexOf('pt') === 0 ? '/br/' : '/au/';
        window.location.replace(target);
      } catch (e) { /* fallback: mostra a tela de escolha abaixo */ }
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #0a1628 0%, #0e2f72 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .box { max-width: 460px; }
    .brand { font-size: 22px; font-weight: 800; margin-bottom: 28px; }
    h1 { font-size: 26px; margin-bottom: 8px; font-weight: 800; }
    p { color: #cbd5e1; margin-bottom: 28px; }
    .choices { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a.choice {
      display: block; text-decoration: none; color: #fff;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 24px 28px; min-width: 160px; transition: all 0.25s;
    }
    a.choice:hover { border-color: #a78bfa; background: rgba(167,139,250,0.12); transform: translateY(-3px); }
    a.choice .flag { font-size: 34px; display: block; margin-bottom: 10px; }
    a.choice .name { font-weight: 700; font-size: 18px; }
    a.choice .sub { color: #94a3b8; font-size: 13px; margin-top: 4px; }
  </style>
  <!-- Identidade visual compartilhada -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/theme.css" />
</head>
<body>
  <div class="box">
    <div class="brand">Alessandro Falanque</div>
    <h1>Escolha seu idioma · Choose your language</h1>
    <p>Você será redirecionado automaticamente. Se não acontecer, escolha abaixo.</p>
    <div class="choices">
      <a class="choice" href="/br/">
        <span class="flag">🇧🇷</span>
        <span class="name">Português</span>
        <span class="sub">Brasil</span>
      </a>
      <a class="choice" href="/au/">
        <span class="flag">🇦🇺</span>
        <span class="name">English</span>
        <span class="sub">Australia</span>
      </a>
    </div>
  </div>
</body>
</html>
